[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mgesture"
dynamic = ["version"]
description = "Local webcam hand-gesture mouse control for desktop Linux, macOS, and Windows."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Christian Doxa Hamasiah" }]
dependencies = [
  "numpy>=1.26,<2",
  "mediapipe>=0.10.20,<0.11; platform_system != 'Darwin' or platform_machine == 'arm64'",
  "opencv-contrib-python>=4.8,<5",
  "platformdirs>=4,<5",
  "pynput>=1.7.7,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pyinstaller>=6.10,<7",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
mgesture = "mgesture.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mgesture"]

[tool.hatch.version]
path = "src/mgesture/version.py"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mgesture"]
exclude = ["src/mgesture/vision/hand_landmarker.py"]

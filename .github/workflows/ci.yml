name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare_matrix:
    name: Prepare CI matrix
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate canonical target matrix
        id: matrix
        run: |
          targets="$(python3 scripts/release/prepare_ci_matrix.py)"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "CI matrix: ${targets}"

  python:
    needs: prepare_matrix
    name: Python ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.targets) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          run-install: false
          cache: false
      - name: Configure Windows ARM OpenCV build
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          echo "CMAKE_ARGS=-DBUILD_opencv_dnn=OFF -DENABLE_NEON=OFF" >> $env:GITHUB_ENV
          echo "SKBUILD_CONFIGURE_OPTIONS=-DBUILD_opencv_dnn=OFF -DENABLE_NEON=OFF" >> $env:GITHUB_ENV
          echo "PIXI_CACHE_DIR=C:\\p" >> $env:GITHUB_ENV
      - name: Install environment
        run: pixi install --locked
      - name: Validate native runner architecture
        run: pixi run python scripts/release/validate_architecture.py runner --target ${{ matrix.target }}
      - name: Validate canonical target row
        run: >-
          pixi run python -c
          "import sys; sys.path.insert(0, 'scripts/release'); from release_targets import target;
          row = target('${{ matrix.target }}'); assert row.runner == '${{ matrix.runner }}'"
      - name: Validate canonical Mojo source
        run: pixi run python scripts/release/validate_mojo_source.py
      - name: Test
        run: pixi run test
      - name: Headless fake-input self-test
        run: pixi run python -m mgesture self-test --headless --fake-input
      - name: Lint
        run: pixi run lint
      - name: Format check
        run: pixi run format
      - name: Type check
        run: pixi run typecheck
      - name: Build source package
        run: pixi run build
      - name: Package and release metadata checks
        run: pixi run release-check
      - name: Confirm native Windows Mojo failure is explicit
        if: runner.os == 'Windows'
        run: pixi run python scripts/release/check_mojo_unavailable.py

  mojo:
    needs: prepare_matrix
    name: Mojo ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.targets) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          run-install: false
          cache: false
      - name: Install environment
        run: pixi install --locked
      - name: Validate native runner architecture
        run: pixi run python scripts/release/validate_architecture.py runner --target ${{ matrix.target }}
      - name: Validate canonical target row
        run: >-
          pixi run python -c
          "import sys; sys.path.insert(0, 'scripts/release'); from release_targets import target;
          row = target('${{ matrix.target }}'); assert row.runner == '${{ matrix.runner }}' and row.mojo_ci_mode == '${{ matrix.mojo_ci_mode }}'"
      - name: Validate canonical Mojo source
        run: pixi run python scripts/release/validate_mojo_source.py
      - name: Summarize Mojo validation mode
        env:
          TARGET: ${{ matrix.target }}
          MODE: ${{ matrix.mojo_ci_mode }}
        run: |
          pixi run python -c "import os; from pathlib import Path; n=chr(10); mode=os.environ['MODE']; Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('## Mojo validation'+n+n+'- Target: '+os.environ['TARGET']+n+'- Mojo source: available'+n+'- Validation mode: '+mode+n+'- Native Mojo runtime: '+('available' if mode == 'native' else 'unavailable')+n+'- Python fallback: available'+n)"
      - name: Validate expected native Mojo unavailability
        if: matrix.mojo_ci_mode == 'source-contract'
        run: pixi run python scripts/release/check_mojo_unavailable.py --target ${{ matrix.target }}
      - name: Show Mojo version
        if: matrix.mojo_ci_mode == 'native'
        run: pixi run mojo --version
      - name: Compile Mojo
        if: matrix.mojo_ci_mode == 'native'
        run: pixi run mojo-build
      - name: Mojo tests
        if: matrix.mojo_ci_mode == 'native'
        run: pixi run mojo-test
      - name: Python/Mojo parity tests
        if: matrix.mojo_ci_mode == 'native'
        run: pixi run pytest -q tests/unit/test_mojo_parity.py
      - name: Deterministic reference tests
        run: pixi run test
      - name: Headless fake-input self-test
        run: pixi run python -m mgesture self-test --headless --fake-input
      - name: Deterministic replay
        run: pixi run replay

  release-dry-run:
    name: Standalone Linux dry run
    runs-on: ubuntu-24.04
    needs: [python, mojo]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          run-install: false
          cache: false
      - name: Install environment and pinned model
        run: |
          pixi install --locked
          pixi run python -m mgesture model install
      - name: Validate native runner architecture
        run: pixi run python scripts/release/validate_architecture.py runner --target x86_64-unknown-linux-gnu
      - name: Build and smoke standalone bundle
        run: |
          pixi run package-local
          mkdir -p "$RUNNER_TEMP/mgesture-smoke"
          tar -xzf dist/mgesture-x86_64-unknown-linux-gnu.tar.gz -C "$RUNNER_TEMP/mgesture-smoke"
          "$RUNNER_TEMP/mgesture-smoke/mgesture/bin/mgesture" --version
          "$RUNNER_TEMP/mgesture-smoke/mgesture/bin/mgesture" self-test --headless --fake-input

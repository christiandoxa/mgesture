name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          run-install: false
          cache: false
      - name: Configure Windows ARM OpenCV build
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          echo "CMAKE_ARGS=-DBUILD_opencv_dnn=OFF -DENABLE_NEON=OFF" >> $env:GITHUB_ENV
          echo "PIXI_CACHE_DIR=C:\\p" >> $env:GITHUB_ENV
      - name: Install environment
        run: pixi install --locked
      - name: Validate native runner architecture
        run: pixi run python scripts/release/validate_architecture.py runner --target ${{ matrix.target }}
      - name: Validate canonical target row
        run: >-
          pixi run python -c
          "import sys; sys.path.insert(0, 'scripts/release'); from release_targets import target;
          row = target('${{ matrix.target }}'); assert row.runner == '${{ matrix.os }}'"
      - name: Test
        run: pixi run test
      - name: Headless fake-input self-test
        run: pixi run python -m mgesture self-test --headless --fake-input
      - name: Lint
        run: pixi run lint
      - name: Format check
        run: pixi run format
      - name: Type check
        run: pixi run typecheck
      - name: Build source package
        run: pixi run build
      - name: Package and release metadata checks
        run: pixi run release-check
      - name: Confirm native Windows Mojo failure is explicit
        if: runner.os == 'Windows'
        run: pixi run python scripts/release/check_mojo_unavailable.py

  mojo:
    name: Mojo ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          run-install: false
          cache: false
      - name: Install environment
        run: pixi install --locked
      - name: Validate native runner architecture
        run: pixi run python scripts/release/validate_architecture.py runner --target ${{ matrix.target }}
      - name: Validate canonical target row
        run: >-
          pixi run python -c
          "import sys; sys.path.insert(0, 'scripts/release'); from release_targets import target;
          row = target('${{ matrix.target }}'); assert row.runner == '${{ matrix.os }}'"
      - name: Compile Mojo
        run: pixi run mojo-build
      - name: Mojo tests
        run: pixi run mojo-test
      - name: Python tests
        run: pixi run test

  release-dry-run:
    name: Standalone Linux dry run
    runs-on: ubuntu-24.04
    needs: [python, mojo]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          run-install: false
          cache: false
      - name: Install environment and pinned model
        run: |
          pixi install --locked
          pixi run python -m mgesture model install
      - name: Validate native runner architecture
        run: pixi run python scripts/release/validate_architecture.py runner --target x86_64-unknown-linux-gnu
      - name: Build and smoke standalone bundle
        run: |
          pixi run package-local
          mkdir -p "$RUNNER_TEMP/mgesture-smoke"
          tar -xzf dist/mgesture-x86_64-unknown-linux-gnu.tar.gz -C "$RUNNER_TEMP/mgesture-smoke"
          "$RUNNER_TEMP/mgesture-smoke/mgesture/bin/mgesture" --version
          "$RUNNER_TEMP/mgesture-smoke/mgesture/bin/mgesture" self-test --headless --fake-input

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mgesture-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare_matrix:
    name: Prepare CI matrix
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate canonical target matrix
        id: matrix
        run: |
          targets="$(python3 scripts/release/prepare_ci_matrix.py)"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "CI matrix: ${targets}"

  build_mojo_objects:
    name: Build cross-target Mojo objects
    needs: prepare_matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          cache: true
          cache-key: mgesture-pixi-0.77.1-x86_64-unknown-linux-gnu-standard-${{ hashFiles('pixi.toml', 'pyproject.toml') }}-
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: Inspect Mojo compiler targets
        run: |
          pixi run mojo --version
          pixi run mojo build --print-supported-targets
      - name: Emit cross-target Mojo objects
        run: pixi run python scripts/release/build_mojo_objects.py --output-dir mojo-objects
      - name: Probe all Mojo target capabilities
        run: pixi run python scripts/release/probe_mojo_target.py --all --output mojo-objects/mojo-capability.json
      - name: Validate cross-target object set
        run: |
          test "$(find mojo-objects -maxdepth 1 -type f -name '*.o' | wc -l)" = 3
      - name: Run canonical Mojo tests
        run: pixi run mojo-test
      - name: Upload cross-target Mojo objects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mojo-cross-objects
          path: mojo-objects
          if-no-files-found: error

  prepare_model:
    name: Prepare verified model
    needs: prepare_matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          cache: true
          cache-key: mgesture-pixi-0.77.1-x86_64-unknown-linux-gnu-standard-${{ hashFiles('pixi.toml', 'pyproject.toml') }}-
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: Download and verify pinned model
        run: |
          mkdir -p model
          pixi run python -m mgesture model install --path model/hand_landmarker.task
          pixi run python -c "from pathlib import Path; from mgesture.vision.model_manager import MODEL_SHA256, checksum; path=Path('model/hand_landmarker.task'); assert checksum(path) == MODEL_SHA256"
      - name: Upload verified model
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-model
          path: model/hand_landmarker.task*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  quality:
    name: Quality (platform-independent)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          cache: true
          cache-key: mgesture-pixi-0.77.1-x86_64-unknown-linux-gnu-standard-${{ hashFiles('pixi.toml', 'pyproject.toml') }}-
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: pixi run test
      - name: Lint
        run: pixi run lint
      - name: Format check
        run: pixi run format
      - name: Type check
        run: pixi run typecheck
      - name: Build source package
        run: pixi run build
      - name: Package and release metadata checks
        run: pixi run release-check

  python:
    needs: prepare_matrix
    name: Python ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.targets) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure Windows ARM OpenCV build
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          echo "CMAKE_ARGS=-DBUILD_opencv_dnn=OFF -DENABLE_NEON=OFF" >> $env:GITHUB_ENV
          echo "SKBUILD_CONFIGURE_OPTIONS=-DBUILD_opencv_dnn=OFF -DENABLE_NEON=OFF" >> $env:GITHUB_ENV
          echo "PIXI_CACHE_DIR=C:\\p" >> $env:GITHUB_ENV
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          cache: true
          cache-key: mgesture-pixi-0.77.1-${{ matrix.target }}-${{ matrix.target == 'aarch64-pc-windows-msvc' && 'opencv-dnn-off-neon-off' || 'standard' }}-${{ hashFiles('pixi.toml', 'pyproject.toml') }}-
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate native runner architecture
        run: pixi run python scripts/release/validate_architecture.py runner --target ${{ matrix.target }}
      - name: Validate canonical target row
        run: >-
          pixi run python -c
          "import sys; sys.path.insert(0, 'scripts/release'); from release_targets import target;
          row = target('${{ matrix.target }}'); assert row.runner == '${{ matrix.runner }}'"
      - name: Platform smoke tests
        run: pixi run pytest -q tests/unit/test_camera.py tests/unit/test_input.py tests/unit/test_release_architecture.py
      - name: Python engine self-test
        run: pixi run python -m mgesture self-test --headless --fake-input --engine python
  mojo:
    needs: [prepare_matrix, build_mojo_objects, prepare_model]
    name: Mojo ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.targets) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure Windows ARM OpenCV build
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          echo "CMAKE_ARGS=-DBUILD_opencv_dnn=OFF -DENABLE_NEON=OFF" >> $env:GITHUB_ENV
          echo "SKBUILD_CONFIGURE_OPTIONS=-DBUILD_opencv_dnn=OFF -DENABLE_NEON=OFF" >> $env:GITHUB_ENV
          echo "PIXI_CACHE_DIR=C:\\p" >> $env:GITHUB_ENV
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          cache: true
          cache-key: mgesture-pixi-0.77.1-${{ matrix.target }}-${{ matrix.target == 'aarch64-pc-windows-msvc' && 'opencv-dnn-off-neon-off' || 'standard' }}-${{ hashFiles('pixi.toml', 'pyproject.toml') }}-
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: Download verified model
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-model
          path: model
      - name: Download cross-target Mojo object
        if: matrix.mojo_build_mode == 'cross-object'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mojo-cross-objects
          path: mojo-objects
      - name: Validate native runner architecture
        run: pixi run python scripts/release/validate_architecture.py runner --target ${{ matrix.target }}
      - name: Validate canonical target row
        run: >-
          pixi run python -c
          "import sys; sys.path.insert(0, 'scripts/release'); from release_targets import target;
          row = target('${{ matrix.target }}'); assert row.runner == '${{ matrix.runner }}' and row.mojo_ci_mode == '${{ matrix.mojo_ci_mode }}' and row.mojo_build_mode == '${{ matrix.mojo_build_mode }}'"
      - name: Summarize Mojo validation mode
        env:
          TARGET: ${{ matrix.target }}
          MODE: ${{ matrix.mojo_ci_mode }}
        run: |
          pixi run python -c "import os; from pathlib import Path; n=chr(10); mode=os.environ['MODE']; Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('## Mojo validation'+n+n+'- Target: '+os.environ['TARGET']+n+'- Mojo source: available'+n+'- Validation mode: '+mode+n+'- Native Mojo runtime: '+('available' if mode == 'native' else 'unavailable')+n+'- Python fallback: available'+n)"
      - name: Start Xvfb for Linux input smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb x11-utils x11-xserver-utils
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$RUNNER_TEMP/mgesture-xvfb.log" 2>&1 &
          for attempt in 1 2 3 4 5; do
            DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break
            sleep 1
          done
          DISPLAY=:99 xdpyinfo >/dev/null
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "XDG_SESSION_TYPE=x11" >> "$GITHUB_ENV"
      - name: Build native Mojo library (Linux)
        if: matrix.mojo_build_mode == 'native' && runner.os == 'Linux'
        run: pixi run python scripts/release/build_mojo_library.py --target ${{ matrix.target }} --output build/libmgesture_mojo.so
      - name: Build native Mojo library (macOS)
        if: matrix.mojo_build_mode == 'native' && runner.os == 'macOS'
        run: pixi run python scripts/release/build_mojo_library.py --target ${{ matrix.target }} --output build/libmgesture_mojo.dylib
      - name: Link cross-target Mojo library (macOS)
        if: matrix.mojo_build_mode == 'cross-object' && runner.os == 'macOS'
        run: pixi run python scripts/release/build_mojo_library.py --target ${{ matrix.target }} --object mojo-objects/${{ matrix.target }}.o --output build/libmgesture_mojo.dylib
      - name: Link cross-target Mojo library (Windows)
        if: matrix.mojo_build_mode == 'cross-object' && runner.os == 'Windows'
        run: pixi run python scripts/release/build_mojo_library.py --target ${{ matrix.target }} --object mojo-objects/${{ matrix.target }}.o --output build/mgesture_mojo.dll
      - name: Validate native Mojo ABI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          library=build/libmgesture_mojo.so
          if [ "$RUNNER_OS" = macOS ]; then library=build/libmgesture_mojo.dylib; fi
          pixi run python scripts/release/validate_mojo_abi.py --target "${{ matrix.target }}" --library "$library"
      - name: Validate native Mojo ABI (Windows)
        if: runner.os == 'Windows'
        run: pixi run python scripts/release/validate_mojo_abi.py --target ${{ matrix.target }} --library build/mgesture_mojo.dll
      - name: Probe native Mojo library (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          object=build/libmgesture_mojo.o
          if [ "${{ matrix.mojo_build_mode }}" = cross-object ]; then object="mojo-objects/${{ matrix.target }}.o"; fi
          library=build/libmgesture_mojo.so
          if [ "$RUNNER_OS" = macOS ]; then library=build/libmgesture_mojo.dylib; fi
          pixi run python scripts/release/probe_mojo_target.py --target "${{ matrix.target }}" --object "$object" --library "$library" --output build/mojo-probe.json
          pixi run python -c "import json; report=json.load(open('build/mojo-probe.json')); assert report['targets']['${{ matrix.target }}']['native']['executed'] is True"
      - name: Probe native Mojo library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $object = "mojo-objects\${{ matrix.target }}.o"
          $library = "build\mgesture_mojo.dll"
          pixi run python scripts/release/probe_mojo_target.py --target "${{ matrix.target }}" --object $object --library $library --output build/mojo-probe.json
          pixi run python -c "import json; report=json.load(open('build/mojo-probe.json')); assert report['targets']['${{ matrix.target }}']['native']['executed'] is True"
      - name: Show native Mojo compiler version
        if: matrix.mojo_build_mode == 'native'
        run: pixi run mojo --version
      - name: Mojo native tests
        if: matrix.mojo_build_mode == 'native'
        run: pixi run mojo-test
      - name: Native Mojo ABI contract tests
        run: pixi run pytest -q tests/unit/test_mojo_abi.py
      - name: Python/Mojo parity tests
        run: pixi run pytest -q tests/unit/test_mojo_parity.py
      - name: Headless fake-input self-test
        run: pixi run python -m mgesture self-test --headless --fake-input --engine mojo
      - name: Deterministic replay
        run: pixi run python -m mgesture replay --engine mojo
      - name: Build standalone candidate (Unix)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$(pixi run python -c 'from mgesture.version import __version__; print(__version__)')"
          library=build/libmgesture_mojo.so
          if [ "$RUNNER_OS" = macOS ]; then library=build/libmgesture_mojo.dylib; fi
          pixi run python scripts/release/build_bundle.py \
            --target "${{ matrix.target }}" \
            --output "dist/${{ matrix.asset }}" \
            --model model/hand_landmarker.task \
            --version "$version" \
            --commit "$GITHUB_SHA" \
            --mojo-library "$library"
      - name: Build standalone candidate (Windows)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (pixi run python -c "from mgesture.version import __version__; print(__version__)").Trim()
          pixi run python scripts/release/build_bundle.py `
            --target "${{ matrix.target }}" `
            --output "dist/${{ matrix.asset }}" `
            --model "model/hand_landmarker.task" `
            --version $version `
            --commit $env:GITHUB_SHA `
            --mojo-library "build/mgesture_mojo.dll"
      - name: Smoke standalone candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pixi run python scripts/release/smoke_bundle.py --archive "dist/${{ matrix.asset }}" --target "${{ matrix.target }}"
      - name: Upload standalone candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standalone-candidate-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release-dry-run:
    name: Standalone Linux dry run
    runs-on: ubuntu-24.04
    needs: [quality, python, mojo]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          cache: true
          cache-key: mgesture-pixi-0.77.1-x86_64-unknown-linux-gnu-standard-${{ hashFiles('pixi.toml', 'pyproject.toml') }}-
          cache-write: ${{ github.ref == 'refs/heads/main' }}
      - name: Start Xvfb for Linux input smoke
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb x11-utils x11-xserver-utils
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$RUNNER_TEMP/mgesture-xvfb.log" 2>&1 &
          for attempt in 1 2 3 4 5; do
            DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break
            sleep 1
          done
          DISPLAY=:99 xdpyinfo >/dev/null
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "XDG_SESSION_TYPE=x11" >> "$GITHUB_ENV"
      - name: Download exact main candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: standalone-candidate-x86_64-unknown-linux-gnu
          path: dist
      - name: Install model for non-main representative build
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: pixi run python -m mgesture model install
      - name: Validate native runner architecture
        run: pixi run python scripts/release/validate_architecture.py runner --target x86_64-unknown-linux-gnu
      - name: Build representative standalone bundle for non-main CI
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          pixi run package-local
      - name: Smoke standalone bundle
        run: pixi run python scripts/release/smoke_bundle.py --archive dist/mgesture-x86_64-unknown-linux-gnu.tar.gz --target x86_64-unknown-linux-gnu

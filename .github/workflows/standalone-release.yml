name: Standalone release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version in src/mgesture/version.py
        required: true
        type: string
      target_sha:
        description: Exact full 40-character main commit to release
        required: true
        type: string

concurrency:
  group: mgesture-standalone-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-ci:
    name: Verify exact source and CI
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.target.outputs.version }}
      target_sha: ${{ steps.target.outputs.target_sha }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate dispatch target and version
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = main
          test "${GITHUB_SHA}" = "${REQUESTED_SHA}"
          printf '%s' "${REQUESTED_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          version="$(python3 scripts/release/validate_version.py --version "${REQUESTED_VERSION}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${REQUESTED_SHA}" >> "$GITHUB_OUTPUT"
      - name: Resolve successful exact-SHA CI and candidate artifacts
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            record="$(gh run list --workflow ci.yml --event push --limit 50 --json databaseId,headSha,status,conclusion --jq '[.[] | select(.headSha == env.TARGET_SHA)] | .[0] // empty' || true)"
            if [ -z "${record}" ]; then
              sleep 30
              continue
            fi
            status="$(printf '%s' "${record}" | jq -r '.status')"
            conclusion="$(printf '%s' "${record}" | jq -r '.conclusion // empty')"
            if [ "${status}" != completed ]; then
              sleep 30
              continue
            fi
            if [ "${conclusion}" != success ]; then
              echo "exact-SHA CI did not pass: ${status}/${conclusion}" >&2
              exit 1
            fi
            ci_run_id="$(printf '%s' "${record}" | jq -r '.databaseId')"
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}")"
            test "$(printf '%s' "${run_json}" | jq -r '.head_sha')" = "${TARGET_SHA}"
            test "$(printf '%s' "${run_json}" | jq -r '.head_branch')" = main
            test "$(printf '%s' "${run_json}" | jq -r '.event')" = push
            python_jobs="$(gh run view "${ci_run_id}" --json jobs --jq '[.jobs[] | select(.name | startswith("Python ")) | select(.conclusion == "success")] | length')"
            mojo_jobs="$(gh run view "${ci_run_id}" --json jobs --jq '[.jobs[] | select(.name | startswith("Mojo ")) | select(.conclusion == "success")] | length')"
            candidate_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}/artifacts" --jq '[.artifacts[] | select(.name | startswith("standalone-candidate-"))] | length')"
            test "${python_jobs}" = 6
            test "${mojo_jobs}" = 6
            test "${candidate_count}" = 6
            echo "ci_run_id=${ci_run_id}" >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo 'timed out waiting for exact-SHA CI and six candidate artifacts' >&2
          exit 1

  prepare:
    name: Prepare verified release assets
    needs: verify-ci
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-ci.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download exact-SHA candidate archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: standalone-candidate-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-ci.outputs.ci_run_id }}
          digest-mismatch: error
      - name: Validate six candidate archives
        env:
          VERSION: ${{ needs.verify-ci.outputs.version }}
          TARGET_SHA: ${{ needs.verify-ci.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f \( -name 'mgesture-*.tar.gz' -o -name 'mgesture-*.zip' \) | wc -l)" = 6
          python3 - <<'PY'
          import json
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          expected = {
              "mgesture-x86_64-unknown-linux-gnu.tar.gz",
              "mgesture-aarch64-unknown-linux-gnu.tar.gz",
              "mgesture-x86_64-apple-darwin.tar.gz",
              "mgesture-aarch64-apple-darwin.tar.gz",
              "mgesture-x86_64-pc-windows-msvc.zip",
              "mgesture-aarch64-pc-windows-msvc.zip",
          }
          assets = {path.name for path in Path("release-assets").iterdir() if path.is_file()}
          assert expected <= assets
          for name in expected:
              path = Path("release-assets") / name
              if name.endswith(".zip"):
                  with zipfile.ZipFile(path) as archive:
                      member = next(item for item in archive.namelist() if item.endswith("share/mgesture/release-metadata.json"))
                      metadata = json.loads(archive.read(member))
              else:
                  with tarfile.open(path, "r:gz") as archive:
                      member = next(item for item in archive.getmembers() if item.name.endswith("share/mgesture/release-metadata.json"))
                      handle = archive.extractfile(member)
                      assert handle is not None
                      metadata = json.load(handle)
              assert metadata["version"] == os.environ["VERSION"], name
              assert metadata["commit"] == os.environ["TARGET_SHA"], name
              assert metadata["target"] in name, name
          PY
      - name: Set up Pixi for metadata and SBOM
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          cache: true
          cache-key: mgesture-pixi-0.77.1-x86_64-unknown-linux-gnu-standard-${{ hashFiles('pixi.toml', 'pyproject.toml') }}-
          cache-write: false
      - name: Prepare manifest, SBOM, and checksums
        env:
          VERSION: ${{ needs.verify-ci.outputs.version }}
          COMMIT: ${{ needs.verify-ci.outputs.target_sha }}
        run: |
          set -euo pipefail
          cp install.sh install.ps1 release-assets/
          pixi run python scripts/release/render_manifest.py --version "$VERSION" --commit "$COMMIT" --assets release-assets --output release-assets
          pixi run python scripts/release/sbom.py --version "$VERSION" --assets release-assets --output release-assets/mgesture-sbom.spdx.json
          pixi run python scripts/release/generate_checksums.py release-assets
          pixi run python scripts/release/verify_release.py release-assets --version "$VERSION"
      - name: Attest final archive and SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/mgesture-*.tar.gz
            release-assets/mgesture-*.zip
            release-assets/mgesture-sbom.spdx.json
      - name: Install and validate ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install --yes clamav
          sudo systemctl stop clamav-freshclam.service
          sudo freshclam --stdout
          scripts/release/scan_assets.sh release-assets
      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-assets
          path: release-assets
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [verify-ci, prepare]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-ci.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-release-assets
          path: release-assets
      - name: Publish exact commit release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-ci.outputs.version }}
          TARGET_SHA: ${{ needs.verify-ci.outputs.target_sha }}
        run: |
          set -euo pipefail
          release="v${VERSION}"
          notes_file="release-notes/${release}.md"
          test -f "${notes_file}"
          notes="$(cat "${notes_file}")"
          notes="${notes}"$'\n\nVerified build commit: '"${TARGET_SHA}"
          if gh release view "${release}" >/dev/null 2>&1; then
            gh release edit "${release}" --title "mgesture ${VERSION}" --notes "${notes}"
            gh release upload "${release}" release-assets/* --clobber
          else
            gh release create "${release}" release-assets/* --target "${TARGET_SHA}" --title "mgesture ${VERSION}" --notes "${notes}"
          fi

name: Standalone release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version in src/mgesture/version.py
        required: true
        type: string
      target_sha:
        description: Exact full 40-character main commit to release
        required: true
        type: string

concurrency:
  group: mgesture-standalone-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-ci:
    name: Verify exact source and CI
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.target.outputs.version }}
      target_sha: ${{ steps.target.outputs.target_sha }}
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate dispatch target and version
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.target_sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = main
          test "${GITHUB_SHA}" = "${REQUESTED_SHA}"
          printf '%s' "${REQUESTED_SHA}" | grep -Eq '^[0-9a-f]{40}$'
          version="$(python3 scripts/release/validate_version.py --version "${REQUESTED_VERSION}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${REQUESTED_SHA}" >> "$GITHUB_OUTPUT"
      - name: Wait for successful CI run at exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            result="$(gh run list --workflow ci.yml --event push --limit 50 --json headSha,status,conclusion --jq '.[] | select(.headSha == env.TARGET_SHA) | [.status,.conclusion] | @tsv' | head -n1 || true)"
            if [ "${result}" = $'completed\tsuccess' ]; then exit 0; fi
            if printf '%s' "${result}" | grep -q $'^completed\t'; then echo "exact-SHA CI did not pass: ${result}" >&2; exit 1; fi
            sleep 30
          done
          echo 'timed out waiting for exact-SHA CI' >&2
          exit 1
      - name: Generate canonical release matrix
        id: matrix
        run: |
          targets="$(python3 scripts/release/prepare_ci_matrix.py)"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

  build_mojo_objects:
    name: Build cross-target Mojo objects
    needs: verify-ci
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-ci.outputs.target_sha }}
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          run-install: false
          cache: false
      - name: Install environment
        run: pixi install --locked
      - name: Inspect Mojo compiler
        run: |
          pixi run mojo --version
          pixi run mojo build --print-supported-targets
      - name: Emit cross-target Mojo objects
        run: pixi run python scripts/release/build_mojo_objects.py --output-dir mojo-objects
      - name: Probe all Mojo target capabilities
        run: pixi run python scripts/release/probe_mojo_target.py --all --output mojo-objects/mojo-capability.json
      - name: Validate cross-target object set
        run: test "$(find mojo-objects -maxdepth 1 -type f -name '*.o' | wc -l)" = 3
      - name: Upload cross-target Mojo objects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mojo-cross-objects
          path: mojo-objects
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: [verify-ci, build_mojo_objects]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-ci.outputs.targets) }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-ci.outputs.target_sha }}
          persist-credentials: false
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          run-install: false
          cache: false
      - name: Configure Windows ARM OpenCV build
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          echo "CMAKE_ARGS=-DBUILD_opencv_dnn=OFF -DENABLE_NEON=OFF" >> $env:GITHUB_ENV
          echo "SKBUILD_CONFIGURE_OPTIONS=-DBUILD_opencv_dnn=OFF -DENABLE_NEON=OFF" >> $env:GITHUB_ENV
          echo "PIXI_CACHE_DIR=C:\\p" >> $env:GITHUB_ENV
      - name: Install dependencies and model
        run: |
          pixi install --locked
          pixi run python -m mgesture model install
      - name: Download cross-target Mojo object
        if: matrix.mojo_build_mode == 'cross-object'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mojo-cross-objects
          path: mojo-objects
      - name: Validate native runner architecture
        run: pixi run python scripts/release/validate_architecture.py runner --target ${{ matrix.target }}
      - name: Validate canonical target row
        run: >-
          pixi run python -c
          "import sys; sys.path.insert(0, 'scripts/release'); from release_targets import target;
          row = target('${{ matrix.target }}'); assert row.publishable and row.runner == '${{ matrix.runner }}' and row.asset == '${{ matrix.asset }}' and row.mojo_ci_mode == 'native' and row.mojo_build_mode == '${{ matrix.mojo_build_mode }}'"
      - name: Build native Mojo library (Linux)
        if: matrix.mojo_build_mode == 'native' && runner.os == 'Linux'
        run: pixi run python scripts/release/build_mojo_library.py --target ${{ matrix.target }} --output build/libmgesture_mojo.so
      - name: Build native Mojo library (macOS)
        if: matrix.mojo_build_mode == 'native' && runner.os == 'macOS'
        run: pixi run python scripts/release/build_mojo_library.py --target ${{ matrix.target }} --output build/libmgesture_mojo.dylib
      - name: Link cross-target Mojo library (macOS)
        if: matrix.mojo_build_mode == 'cross-object' && runner.os == 'macOS'
        run: pixi run python scripts/release/build_mojo_library.py --target ${{ matrix.target }} --object mojo-objects/${{ matrix.target }}.o --output build/libmgesture_mojo.dylib
      - name: Link cross-target Mojo library (Windows)
        if: matrix.mojo_build_mode == 'cross-object' && runner.os == 'Windows'
        run: pixi run python scripts/release/build_mojo_library.py --target ${{ matrix.target }} --object mojo-objects/${{ matrix.target }}.o --output build/mgesture_mojo.dll
      - name: Validate native Mojo ABI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          library=build/libmgesture_mojo.so
          if [ "$RUNNER_OS" = macOS ]; then library=build/libmgesture_mojo.dylib; fi
          pixi run python scripts/release/validate_mojo_abi.py --target "${{ matrix.target }}" --library "$library"
      - name: Validate native Mojo ABI (Windows)
        if: runner.os == 'Windows'
        run: pixi run python scripts/release/validate_mojo_abi.py --target ${{ matrix.target }} --library build/mgesture_mojo.dll
      - name: Probe native Mojo library (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          object=build/libmgesture_mojo.o
          if [ "${{ matrix.mojo_build_mode }}" = cross-object ]; then object="mojo-objects/${{ matrix.target }}.o"; fi
          library=build/libmgesture_mojo.so
          if [ "$RUNNER_OS" = macOS ]; then library=build/libmgesture_mojo.dylib; fi
          pixi run python scripts/release/probe_mojo_target.py --target "${{ matrix.target }}" --object "$object" --library "$library" --output build/mojo-probe.json
          pixi run python -c "import json; report=json.load(open('build/mojo-probe.json')); assert report['targets']['${{ matrix.target }}']['native']['executed'] is True"
      - name: Probe native Mojo library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $object = "mojo-objects\${{ matrix.target }}.o"
          $library = "build\mgesture_mojo.dll"
          pixi run python scripts/release/probe_mojo_target.py --target "${{ matrix.target }}" --object $object --library $library --output build/mojo-probe.json
          pixi run python -c "import json; report=json.load(open('build/mojo-probe.json')); assert report['targets']['${{ matrix.target }}']['native']['executed'] is True"
      - name: Build standalone archive (Unix)
        if: runner.os != 'Windows'
        run: pixi run python scripts/release/build_bundle.py --target ${{ matrix.target }} --output dist/${{ matrix.asset }} --version ${{ needs.verify-ci.outputs.version }} --commit ${{ needs.verify-ci.outputs.target_sha }} --mojo-library build/libmgesture_mojo.${{ runner.os == 'macOS' && 'dylib' || 'so' }}
      - name: Build standalone archive (Windows)
        if: runner.os == 'Windows'
        run: pixi run python scripts/release/build_bundle.py --target ${{ matrix.target }} --output dist/${{ matrix.asset }} --version ${{ needs.verify-ci.outputs.version }} --commit ${{ needs.verify-ci.outputs.target_sha }} --mojo-library build/mgesture_mojo.dll
      - name: Extract and execute clean-machine smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mgesture-clean"
          tar -xzf "dist/${{ matrix.asset }}" -C "$RUNNER_TEMP/mgesture-clean"
          pixi run python scripts/release/validate_mojo_source.py --root "$RUNNER_TEMP/mgesture-clean/mgesture"
          pixi run python scripts/release/validate_architecture.py bundle --target "${{ matrix.target }}" --root "$RUNNER_TEMP/mgesture-clean/mgesture"
          binary="$RUNNER_TEMP/mgesture-clean/mgesture/bin/mgesture"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/mgesture-home" MGESTURE_BUNDLE_ROOT="$RUNNER_TEMP/mgesture-clean/mgesture" "$binary" --version
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/mgesture-home" MGESTURE_BUNDLE_ROOT="$RUNNER_TEMP/mgesture-clean/mgesture" "$binary" self-test --headless --fake-input --engine mojo
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/mgesture-home" MGESTURE_BUNDLE_ROOT="$RUNNER_TEMP/mgesture-clean/mgesture" "$binary" doctor --runtime --json | tee "$RUNNER_TEMP/mgesture-doctor.json"
          grep -F '"compiler_required": false' "$RUNNER_TEMP/mgesture-doctor.json"
          grep -F '"active_engine": "mojo"' "$RUNNER_TEMP/mgesture-doctor.json"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/mgesture-home" MGESTURE_BUNDLE_ROOT="$RUNNER_TEMP/mgesture-clean/mgesture" "$binary" replay --fixture "$RUNNER_TEMP/mgesture-clean/mgesture/share/mgesture/fixtures/basic.json" --engine mojo >/dev/null
      - name: Extract and execute clean-machine smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smoke = Join-Path $env:RUNNER_TEMP "mgesture-clean"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Expand-Archive -LiteralPath "dist/${{ matrix.asset }}" -DestinationPath $smoke -Force
          $bundle = Join-Path $smoke "mgesture"
          $binary = Join-Path $bundle "bin\mgesture.exe"
          pixi run python scripts/release/validate_mojo_source.py --root $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi run python scripts/release/validate_architecture.py bundle --target "${{ matrix.target }}" --root $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MGESTURE_BUNDLE_ROOT = $bundle
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary self-test --headless --fake-input --engine mojo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $doctor = & $binary doctor --runtime --json | Out-String
          if ($LASTEXITCODE -ne 0 -or ($doctor -notmatch '"compiler_required": false') -or ($doctor -notmatch '"active_engine": "mojo"')) { throw "standalone runtime diagnostics failed" }
          & $binary replay --fixture (Join-Path $bundle "share\mgesture\fixtures\basic.json") --engine mojo | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload standalone archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: standalone-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  prepare:
    name: Prepare verified release assets
    needs: [verify-ci, build]
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-ci.outputs.target_sha }}
          persist-credentials: false
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true
      - name: Set up Pixi for metadata and SBOM
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          pixi-version: v0.77.1
          cache: true
      - name: Install metadata environment
        run: pixi install --locked
      - name: Prepare manifest, SBOM, and checksums
        env:
          VERSION: ${{ needs.verify-ci.outputs.version }}
          COMMIT: ${{ needs.verify-ci.outputs.target_sha }}
        run: |
          set -euo pipefail
          cp install.sh install.ps1 release-assets/
          pixi run python scripts/release/render_manifest.py --version "$VERSION" --commit "$COMMIT" --assets release-assets --output release-assets
          pixi run python scripts/release/sbom.py --version "$VERSION" --assets release-assets --output release-assets/mgesture-sbom.spdx.json
          pixi run python scripts/release/generate_checksums.py release-assets
          pixi run python scripts/release/verify_release.py release-assets --version "$VERSION"
      - name: Attest final archive and SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/mgesture-*.tar.gz
            release-assets/mgesture-*.zip
            release-assets/mgesture-sbom.spdx.json
      - name: Install and validate ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install --yes clamav
          sudo systemctl stop clamav-freshclam.service
          sudo freshclam --stdout
          scripts/release/scan_assets.sh release-assets
      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-assets
          path: release-assets
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify-ci, prepare]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-ci.outputs.target_sha }}
          persist-credentials: false
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-release-assets
          path: release-assets
      - name: Publish exact commit release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-ci.outputs.version }}
          TARGET_SHA: ${{ needs.verify-ci.outputs.target_sha }}
        run: |
          set -euo pipefail
          release="v${VERSION}"
          notes=$'Verified build commit: '"${TARGET_SHA}"$'\n\nStandalone targets: Linux x86_64/ARM64, macOS x86_64/ARM64, and Windows x86_64/ARM64. Every bundle contains the native Mojo engine plus the Python reference fallback; GPU support remains runtime-specific.'
          if gh release view "${release}" >/dev/null 2>&1; then
            gh release edit "${release}" --title "mgesture ${VERSION}" --notes "${notes}"
            gh release upload "${release}" release-assets/* --clobber
          else
            gh release create "${release}" release-assets/* --target "${TARGET_SHA}" --title "mgesture ${VERSION}" --notes "${notes}"
          fi
